name: Deploy web to VPS

# Push to main → GitHub builds the React app and rsyncs dist/ to the VPS.
# The only secret needed is VPS_SSH_KEY (the ~/.ssh/pretika_vps private key).
# Build env comes from the committed .env.production (same-origin, no secrets).

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

concurrency:
  group: deploy-web
  cancel-in-progress: true # a newer push supersedes an in-flight web deploy

env:
  VPS_HOST: 200.141.11.48
  VPS_USER: root
  VPS_PATH: /var/www/pretika/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (uses .env.production)
        run: npm run build

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # best-effort: a slow/blocked keyscan must not fail the whole deploy
          # (shell runs with -e). rsync below uses StrictHostKeyChecking=accept-new.
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy dist/ to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
            dist/ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}"
